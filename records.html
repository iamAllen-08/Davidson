<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Dashboard - Family Expense Tracker</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, cyan, lightgreen);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      background: #ffffff; /* solid white */
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.2);
      text-align: center;
    }
    h1 {
      color: #004d40;
      margin-bottom: 20px;
    }
    .balance {
      font-size: 1.5em;
      font-weight: bold;
      margin: 15px 0;
    }
    .earnings {
      color: green;
    }
    .remaining {
      color: #00695c;
    }
    .status {
      font-size: 1.2em;
      margin-top: 10px;
      font-weight: bold;
    }
    .overspend {
      color: red;
    }
    .safe {
      color: green;
    }
    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
      background: #f5f5f5; /* solid light gray */
      border-radius: 10px;
      overflow: hidden;
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid #cccccc; /* solid border */
      text-align: center;
    }
    th {
      background: #008080; /* solid teal */
      color: #ffffff; /* white text */
    }
    td.expense {
      color: red;
      font-weight: bold;
    }
    td.earning {
      color: green;
      font-weight: bold;
    }
    .nav-btn {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      background: #008080; /* solid teal */
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      transition: 0.3s;
      margin: 5px;
    }
    .nav-btn:hover {
      background: #006666; /* darker teal */
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Expense Dashboard</h1>
    <div class="balance earnings" id="earningsDisplay">Total Earnings: ₹0</div>
    <div class="balance remaining" id="remainingDisplay">Remaining Balance: ₹0</div>
    <div class="status" id="statusMessage"></div>

    <!-- Earnings History -->
    <h2 style="color:green; margin-top:30px;">Earnings History</h2>
    <table id="earningsTable">
      <thead>
        <tr>
          <th>Month</th>
          <th>Earnings (₹)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <!-- Expenses -->
    <h2 style="color:red; margin-top:30px;">Expenses</h2>
    <table id="expenseTable">
      <thead>
        <tr>
          <th>Category</th>
          <th>Amount (₹)</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <a href="random.html" class="nav-btn">Go to Earnings</a>
    <a href="expp.html" class="nav-btn">Go to Record Expenses</a>
    <a href="welcome.html" class="nav-btn">Back to Home</a>
  </div>

  <script>
    const activeUser = JSON.parse(localStorage.getItem("userData"));
    if (!activeUser || !activeUser.email) {
      alert("No active user found. Please log in first.");
      window.location.href = "login.html";
    }

    const userKey = `expenseRecords_${activeUser.email}`;
    let records = JSON.parse(localStorage.getItem(userKey)) || [];

    const earningsHistoryKey = `earningsHistory_${activeUser.email}`;
    let earningsHistory = JSON.parse(localStorage.getItem(earningsHistoryKey)) || [];

    function renderEarnings() {
      const tbody = document.querySelector("#earningsTable tbody");
      tbody.innerHTML = "";
      earningsHistory.forEach(entry => {
        const row = document.createElement("tr");
        row.innerHTML = `<td>${entry.month}</td><td class="earning">₹${entry.amount}</td>`;
        tbody.appendChild(row);
      });
    }

    function renderExpenses() {
      const tbody = document.querySelector("#expenseTable tbody");
      tbody.innerHTML = "";
      records.forEach(record => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${record.category || "—"}</td>
          <td class="expense">₹${record.amount || 0}</td>
          <td>${record.date || "—"}</td>
        `;
        tbody.appendChild(row);
      });

      const totalAmount = parseFloat(localStorage.getItem("totalAmount")) || 0;
      const totalSpent = records.reduce((sum, r) => sum + parseFloat(r.amount || 0), 0);
      const remaining = totalAmount - totalSpent;

      document.getElementById("earningsDisplay").textContent = `Total Earnings: ₹${totalAmount}`;
      document.getElementById("remainingDisplay").textContent = `Remaining Balance: ₹${remaining}`;

      const statusMessage = document.getElementById("statusMessage");
      if (totalSpent > totalAmount) {
        statusMessage.textContent = `⚠ Overspending! You spent ₹${totalSpent}, which exceeds your budget of ₹${totalAmount}.`;
        statusMessage.className = "status overspend";
      } else {
        statusMessage.textContent = `✅ Safe! You spent ₹${totalSpent} out of ₹${totalAmount}.`;
        statusMessage.className = "status safe";
      }

      localStorage.setItem("remainingBalance", remaining);
    }

    window.addEventListener("load", () => {
      renderEarnings();
      renderExpenses();
    });
  </script>
</body>
</html>
