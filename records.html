<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Records - Family Expense Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, cyan 0%, white 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.7); /* translucent box */
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    header {
      background: linear-gradient(135deg, #00b4d8, #90e0ef);
      color: white;
      padding: 30px;
      text-align: center;
    }
    .user-info { font-size: 1.2em; margin-bottom: 20px; }
    .summary {
      padding: 20px 30px;
      background: #e3f2fd;
      text-align: center;
    }
    .total { font-size: 2em; color: #d32f2f; font-weight: bold; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }
    th, td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th { background: #b3e5fc; }
    .nav-bar {
      padding: 20px 30px;
      background: #f0f8ff;
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .nav-btn {
      padding: 12px 24px;
      background: #00b4d8;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.3s;
    }
    .nav-btn:hover { background: #0096c7; }

    /* New styles for earnings vs spendings */
    .earning-row td {
      border-left: 5px solid green;
    }
    .spending-row td {
      border-left: 5px solid red;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📈 Previous Records</h1>
      <div class="user-info" id="userInfo">Logged in as: Family Member</div>
    </header>
    
    <div class="summary">
      <div>Total Balance: <span class="total">₹0.00</span></div>
    </div>
    
    <table>
      <thead>
        <tr>
          <th>Amount</th>
          <th>Category</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="recordsTableBody">
        <!-- Records will be injected here -->
      </tbody>
    </table>
    
    <div class="nav-bar">
      <a href="welcome.html" class="nav-btn">Home</a>
      <a href="expp.html" class="nav-btn">Add New Record</a>
      <a href="earnings.html" class="nav-btn">Add Earnings</a>
    </div>
  </div>

  <script>
  const tableBody = document.getElementById('recordsTableBody');
  const totalSpan = document.querySelector('.total');
  const userInfo = document.getElementById('userInfo');

  // Get active user info
  const activeUser = JSON.parse(localStorage.getItem("userData"));
  if (!activeUser || !activeUser.email) {
    alert("No active user found. Please log in first.");
    window.location.href = "login.html";
  }

  // Show logged-in user's name/email
  userInfo.textContent = `Logged in as: ${activeUser.name} (${activeUser.email})`;

  // Keys for records
  const userKey = `expenseRecords_${activeUser.email}`;
  const earningsKey = `monthlyEarnings_${activeUser.email}`;
  const monthKey = `earningsMonth_${activeUser.email}`;

  const records = JSON.parse(localStorage.getItem(userKey)) || [];
  const earnings = localStorage.getItem(earningsKey);
  const earningsMonth = localStorage.getItem(monthKey);

  function renderRecords() {
    tableBody.innerHTML = '';
    let totalSpent = 0;
    let totalEarned = earnings ? parseFloat(earnings) : 0;

    // Show earnings row if available
    if (earnings) {
      const row = document.createElement('tr');
      row.classList.add('earning-row');
      row.innerHTML = `
        <td>₹${parseFloat(earnings).toFixed(2)}</td>
        <td>Earnings (${earningsMonth || "Month not set"})</td>
        <td>-</td>
      `;
      tableBody.appendChild(row);
    }

    // Show spending records
    records.forEach(record => {
      const row = document.createElement('tr');
      row.classList.add('spending-row');
      row.innerHTML = `
        <td>₹${parseFloat(record.amount).toFixed(2)}</td>
        <td>${record.category}</td>
        <td>${record.date}</td>
      `;
      tableBody.appendChild(row);
      totalSpent += parseFloat(record.amount);
    });

    const balance = totalEarned - totalSpent;
    totalSpan.textContent = `₹${balance.toFixed(2)}`;
  }

  renderRecords();
  </script>
</body>
</html>
