<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Earnings - Family Expense Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, cyan 0%, white 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      width: 90%;
      max-width: 700px;
      background: #ffffff; /* solid white */
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      padding: 40px;
      text-align: center;
    }
    header { margin-bottom: 30px; }
    header h1 { color: #0077b6; font-size: 2em; }
    .form-group { margin-bottom: 20px; }
    input, select {
      width: 100%;
      padding: 15px;
      border: 2px solid #cccccc; /* solid border */
      border-radius: 12px;
      font-size: 16px;
      background: #ffffff; /* solid background */
      color: #000;
      text-align: center;
    }
    input:focus, select:focus {
      outline: none;
      border-color: cyan;
      box-shadow: 0 0 0 3px rgba(0,255,255,0.2);
    }
    .save-btn {
      padding: 15px 30px;
      background: #00bfff; /* solid cyan */
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }
    .save-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0,191,255,0.4);
    }
    .nav { margin-top: 25px; }
    .nav a {
      text-decoration: none;
      padding: 12px 25px;
      background: #000000; /* solid black */
      color: white;
      border-radius: 25px;
      transition: all 0.3s;
      margin: 5px;
      display: inline-block;
    }
    .nav a:hover {
      background: #333333; /* darker solid */
      transform: translateY(-2px);
    }
    .status {
      margin-top: 20px;
      font-weight: 600;
      color: #0077b6;
    }
    table {
      width: 100%;
      margin-top: 30px;
      border-collapse: collapse;
      background: #f5f5f5; /* solid light gray */
      border-radius: 10px;
      overflow: hidden;
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid #cccccc; /* solid border */
      text-align: center;
    }
    th {
      background: #008080; /* solid teal */
      color: #ffffff; /* white text */
    }
    td {
      color: #004d40;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Enter Monthly Earnings</h1>
    </header>
    <div class="form-group">
      <input type="number" id="earningsInput" placeholder="Enter your monthly earnings (₹)">
    </div>
    <div class="form-group">
      <select id="monthInput">
        <option value="">Select Month</option>
        <option>January</option>
        <option>February</option>
        <option>March</option>
        <option>April</option>
        <option>May</option>
        <option>June</option>
        <option>July</option>
        <option>August</option>
        <option>September</option>
        <option>October</option>
        <option>November</option>
        <option>December</option>
      </select>
    </div>
    <button class="save-btn" id="saveBtn">Save Earnings</button>
    <div class="status" id="statusMsg"></div>

    <!-- Earnings History Table -->
    <table id="earningsTable">
      <thead>
        <tr>
          <th>Month</th>
          <th>Earnings (₹)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div class="nav">
      <a href="expp.html">Go to Record Expenses</a>
      <a href="total.html">View records</a>
      <a href="welcome.html">Back to Home</a>
    </div>
  </div>

  <script>
    const saveBtn = document.getElementById('saveBtn');
    const earningsInput = document.getElementById('earningsInput');
    const monthInput = document.getElementById('monthInput');
    const statusMsg = document.getElementById('statusMsg');
    const earningsTableBody = document.querySelector("#earningsTable tbody");

    // Get active user info
    const activeUser = JSON.parse(localStorage.getItem("userData"));
    if (!activeUser || !activeUser.email) {
      alert("No active user found. Please log in first.");
      window.location.href = "login.html";
    }

    const earningsHistoryKey = `earningsHistory_${activeUser.email}`;

    // Load saved history
    let earningsHistory = JSON.parse(localStorage.getItem(earningsHistoryKey)) || [];

    function renderHistory() {
      earningsTableBody.innerHTML = "";
      earningsHistory.forEach(entry => {
        const row = document.createElement("tr");
        row.innerHTML = `<td>${entry.month}</td><td>₹${entry.amount}</td>`;
        earningsTableBody.appendChild(row);
      });
    }

    saveBtn.addEventListener('click', () => {
      const earnings = earningsInput.value.trim();
      const month = monthInput.value.trim();

      if (earnings && month) {
        // Save to history
        const newEntry = { month, amount: earnings };
        earningsHistory.push(newEntry);
        localStorage.setItem(earningsHistoryKey, JSON.stringify(earningsHistory));

        // Save to global key for dashboard
        localStorage.setItem("totalAmount", earnings);

        statusMsg.textContent = `Earnings saved: ₹${earnings} (Month: ${month})`;
        renderHistory();
      } else {
        alert("Please enter your earnings amount and select a month!");
      }
    });

    // Render saved history on load
    renderHistory();
  </script>
</body>
</html>
