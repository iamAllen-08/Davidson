<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Family Expense Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      background: linear-gradient(135deg, #00b4d8 0%, #ff9a56 50%, #f0932b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h1 { color: #2c3e50; margin-bottom: 30px; font-size: 2em; }
    input, button {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      background: linear-gradient(135deg, #00b4d8, #ff9a56);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { opacity: 0.9; }
    .google-btn {
      background: #4285f4;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
      color: white;
      text-decoration: none;
      padding: 12px;
      border-radius: 10px;
    }
    .google-icon::before { content: "👤"; font-size: 20px; }
    .toggle-link {
      margin-top: 15px;
      display: block;
      color: #0077b6;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h1 id="form-title">Login to Tracker</h1>
    <form id="loginForm" action="welcome.html" method="get">
      <!-- Login fields -->
      <div id="login-fields">
        <input type="text" name="user" placeholder="Enter your name" required>
      </div>

      <!-- Registration fields (hidden initially) -->
      <div id="register-fields" style="display:none;">
        <input type="text" name="user" placeholder="Enter your name" required>
        <input type="email" name="email" placeholder="Enter your email" required>
        <input type="number" name="age" placeholder="Enter your age" required>
        <input type="password" name="password" placeholder="Enter password" required>
        <input type="password" name="confirmPassword" placeholder="Confirm password" required>
      </div>

      <button type="submit" id="submitBtn">Start Tracking →</button>
    </form>

    <a href="welcome.html" class="google-btn">
      <span class="google-icon"></span> Google Login
    </a>

    <span class="toggle-link" id="toggleLink">First time here? Register</span>
  </div>

  <script>
    const toggleLink = document.getElementById('toggleLink');
    const formTitle = document.getElementById('form-title');
    const loginFields = document.getElementById('login-fields');
    const registerFields = document.getElementById('register-fields');
    const submitBtn = document.getElementById('submitBtn');

    let isRegister = false;

    toggleLink.addEventListener('click', () => {
      isRegister = !isRegister;
      if (isRegister) {
        formTitle.textContent = "Register for Tracker";
        loginFields.style.display = "none";
        registerFields.style.display = "block";
        submitBtn.textContent = "Register →";
        toggleLink.textContent = "Already have an account? Login";
      } else {
        formTitle.textContent = "Login to Tracker";
        loginFields.style.display = "block";
        registerFields.style.display = "none";
        submitBtn.textContent = "Start Tracking →";
        toggleLink.textContent = "First time here? Register";
      }
    });

    // Simple password confirmation check
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      if (isRegister) {
        const password = document.querySelector('input[name="password"]').value;
        const confirmPassword = document.querySelector('input[name="confirmPassword"]').value;
        if (password !== confirmPassword) {
          e.preventDefault();
          alert("Passwords do not match!");
        }
      }
    });
  </script>
</body>
</html>
