<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Family Expense Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      background: linear-gradient(135deg, #00b4d8 0%, #ff9a56 50%, #f0932b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h1 { color: #2c3e50; margin-bottom: 30px; font-size: 2em; }
    input, button {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      background: linear-gradient(135deg, #00b4d8, #ff9a56);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { opacity: 0.9; }
    .error {
      color: red;
      font-size: 14px;
      margin-top: 10px;
    }
    .already {
      margin-top: 20px;
      font-size: 14px;
      color: #666;
    }
    .already a {
      color: #00b4d8;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }
    .already a:hover {
      text-decoration: underline;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>Login to Tracker</h1>
    <!-- Full registration form -->
    <form id="loginForm">
      <input type="text" name="name" placeholder="Enter your name" required>
      <input type="number" name="age" placeholder="Enter your age" required>
      <input type="email" name="email" placeholder="Enter your email" required>
      <input type="password" name="password" placeholder="Enter password" required>
      <input type="password" name="confirmPassword" placeholder="Confirm password" required>
      
      <button type="submit">Start Tracking →</button>
      <div class="error" id="errorMsg"></div>
    </form>

    <!-- Quick login form for already logged in users -->
    <form id="quickLoginForm" class="hidden">
      <input type="text" name="quickName" placeholder="Enter your name" required>
      <input type="email" name="quickEmail" placeholder="Enter your email" required>
      <button type="submit">Continue →</button>
    </form>

    <p class="already"><a id="alreadyLink">Already logged in?</a></p>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const quickForm = document.getElementById('quickLoginForm');
    const alreadyLink = document.getElementById('alreadyLink');
    const errorMsg = document.getElementById('errorMsg');

    // Registration form
    form.addEventListener('submit', function(event) {
      event.preventDefault();

      const name = form.name.value.trim();
      const age = form.age.value.trim();
      const email = form.email.value.trim();
      const password = form.password.value;
      const confirmPassword = form.confirmPassword.value;

      if (parseInt(age) < 13) {
        errorMsg.textContent = "You must be at least 13 years old.";
        return;
      }
      if (password !== confirmPassword) {
        errorMsg.textContent = "Passwords do not match.";
        return;
      }

      const userData = { name, age, email, password };
      localStorage.setItem('userData', JSON.stringify(userData));
      window.location.href = "welcome.html";
    });

    // Toggle quick login form
    alreadyLink.addEventListener('click', () => {
      form.classList.add('hidden');
      quickForm.classList.remove('hidden');
    });

    // Quick login form
    quickForm.addEventListener('submit', function(event) {
      event.preventDefault();

      const quickName = quickForm.quickName.value.trim();
      const quickEmail = quickForm.quickEmail.value.trim();

      if (!quickName || !quickEmail) {
        alert("Please enter both name and email.");
        return;
      }

      const userData = { name: quickName, email: quickEmail };
      localStorage.setItem('userData', JSON.stringify(userData));
      window.location.href = "welcome.html";
    });
  </script>
</body>
</html>
